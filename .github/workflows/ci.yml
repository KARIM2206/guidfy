name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/test_db
      NODE_ENV: test
      JWT_SECRET: ci-dummy-secret
      AI_SERVICE_URL: http://127.0.0.1:4000
      INTERNAL_API_TOKEN: ci-dummy-internal-token
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5000
      EMAIL_USER: ci-dummy@example.com
      EMAIL_PASS: ci-dummy-email-pass
      CLIENT_URL: http://localhost:3000
      PORT: "8000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate

      # يتأكد إن التطبيق بيتحمّل من غير أخطاء require
      - run: node -e "require('./src/app'); setTimeout(() => process.exit(0), 3000)"

      # لما تكتب الـ tests ضيف:
      # - run: npm test
